<input type="file" multiple accept="image/*" class="file-input file-input-bordered w-full mt-4"
  (change)="onFilesChanged($event)" />

<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
  @for (image of tempImages(); track image) {
  <div class="w-full h-full relative group">
    <modal-preview-image [image]="image" imgClass="w-full object-cover rounded-xl hover:opacity-80" />
    <button type="button" class="cursor-pointer opacity-100 text-black bg-gray-200 w-[20px] h-[20px] rounded-full
      absolute top-1 right-1 flex justify-center items-center
      md:opacity-0
      duration-200 group-hover:opacity-80 hover:opacity-100 hover:text-red-500 hover:bg-black"
      (click)="removeImage($index)">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 12 12" class="hover:animate-pulse">
        <path d="M0 0h12v12H0z" fill="none" />
        <path fill="currentColor"
          d="M5 3h2a1 1 0 0 0-2 0M4 3a2 2 0 1 1 4 0h2.5a.5.5 0 0 1 0 1h-.441l-.443 5.17A2 2 0 0 1 7.623 11H4.377a2 2 0 0 1-1.993-1.83L1.941 4H1.5a.5.5 0 0 1 0-1zm3.5 3a.5.5 0 0 0-1 0v2a.5.5 0 0 0 1 0zM5 5.5a.5.5 0 0 0-.5.5v2a.5.5 0 0 0 1 0V6a.5.5 0 0 0-.5-.5" />
      </svg>
    </button>
  </div>
  }
</div>
