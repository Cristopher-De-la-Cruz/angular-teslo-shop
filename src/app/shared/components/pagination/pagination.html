<div class="join flex flex-wrap justify-center items-center">
  @if (activePage() > 1) {
    <pagination-button [page]="1" [(activePage)]="activePage">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 56 56">
        <path d="M0 0h56v56H0z" fill="none" />
        <path fill="currentColor" d="M25.328 47.723c.399.398.914.633 1.524.633c1.218 0 2.133-.915 2.133-2.133c0-.586-.235-1.125-.61-1.524L11.313 28.012l17.062-16.688c.375-.398.61-.96.61-1.523c0-1.219-.915-2.157-2.133-2.157c-.61 0-1.125.235-1.524.633L6.766 26.441c-.446.375-.703.961-.703 1.57c0 .587.257 1.126.703 1.571Zm20.93 0c.422.398.937.633 1.523.633c1.219 0 2.156-.915 2.156-2.133c0-.586-.234-1.125-.609-1.524L32.266 28.012l17.062-16.688c.375-.398.61-.96.61-1.523a2.12 2.12 0 0 0-2.157-2.157a2.1 2.1 0 0 0-1.5.633L27.695 26.441c-.445.375-.68.961-.68 1.57c0 .587.235 1.126.68 1.571Z" />
      </svg>
    </pagination-button>
    <pagination-button [page]="activePage() - 1" [(activePage)]="activePage">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 4l-8 8l8 8" />
      </svg>
    </pagination-button>
  }

  @for (page of getPagesList(); track page) {
    <pagination-button [page]="page" [(activePage)]="activePage">{{ page }}</pagination-button>
  }

  @if (activePage() < finalPage()) {
    <pagination-button [page]="activePage() + 1" [(activePage)]="activePage">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m8 4l8 8l-8 8" />
      </svg>
    </pagination-button>
    <pagination-button [page]="finalPage()" [(activePage)]="activePage">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 56 56">
        <path d="M0 0h56v56H0z" fill="none" />
        <path fill="currentColor" d="M29.149 48.356c.609 0 1.124-.235 1.523-.633l18.586-18.141c.445-.445.68-.984.68-1.57c0-.61-.258-1.196-.703-1.57L30.672 8.276a2.1 2.1 0 0 0-1.524-.632c-1.218 0-2.132.937-2.132 2.156c0 .562.234 1.125.61 1.523l17.062 16.688l-17.063 16.687c-.375.399-.61.938-.61 1.524c0 1.218.915 2.133 2.133 2.133m-20.93 0c.586 0 1.125-.235 1.523-.633l18.563-18.141c.445-.445.68-.984.68-1.57c0-.61-.235-1.196-.68-1.57L9.742 8.276c-.422-.398-.937-.632-1.523-.632A2.12 2.12 0 0 0 6.063 9.8c0 .562.257 1.125.632 1.523l17.04 16.688l-17.04 16.687c-.375.399-.632.938-.632 1.524c0 1.218.937 2.133 2.156 2.133" />
      </svg>
    </pagination-button>
  }

</div>
