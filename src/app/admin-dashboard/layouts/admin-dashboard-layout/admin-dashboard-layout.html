<div class="bg-slate-800 overflow-y-scroll w-screen h-screen antialiased text-slate-300 selection:bg-blue-600 selection:text-white">
    <div class="flex flex-col relative w-screen">
        <div id="menu" class="bg-gray-900 min-h-screen z-10 text-slate-300 w-64 fixed left-0 h-screen overflow-y-scroll hidden xs:hidden sm:hidden md:block">
           <div id="logo" class="my-4 px-6">
            <h1 routerLink="/" class="text-lg md:text-2xl font-bold text-white font-montserrat cursor-pointer">Teslo<span class="text-blue-500"> | Shop</span></h1>
            <p class="text-slate-500 text-sm">Manage your actions and activities</p>
           </div>
           <div id="profile" class="px-6 py-10">
            <p class="text-slate-500">Bienvenido</p>
            <a href="#" class="inline-flex space-x-2 items-center">
                <span>
                    <img class="rounded-full w-8 h-8" src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=128&q=80" alt="">
                </span>
                <span class="text-sm md:text-base font-bold">
                    {{ user()?.fullName }}
                </span>
                </a>
           </div>
           <div id="nav" class="w-full px-6">
            <a routerLink="/admin/dashboards" class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                      </svg>

                </div>
                <div class="flex flex-col">
                    <span class="text-lg font-bold leading-5 text-white">Dashboard</span>
                    <span class="text-sm text-white/50 hidden md:block">Data Overview</span>
                </div>
            </a>
            <a routerLink="/admin/products" routerLinkActive="bg-blue-800" class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
                      </svg>
                </div>
                <div class="flex flex-col">
                    <span class="text-lg text-slate-300 font-bold leading-5">Productos</span>
                    <span class="text-sm text-slate-500 hidden md:block">Listado de Productos</span>
                </div>
            </a>
            <a routerLink="/" routerLinkActive="bg-blue-800" [routerLinkActiveOptions]="{exact: true}" class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150">
                <div>
                  <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024" class="w-6 h-6">
                    <path d="M0 0h1024v1024H0z" fill="none" />
                    <path fill="currentColor" d="M922.9 701.9H327.4l29.9-60.9l496.8-.9c16.8 0 31.2-12 34.2-28.6l68.8-385.1c1.8-10.1-.9-20.5-7.5-28.4a34.99 34.99 0 0 0-26.6-12.5l-632-2.1l-5.4-25.4c-3.4-16.2-18-28-34.6-28H96.5a35.3 35.3 0 1 0 0 70.6h125.9L246 312.8l58.1 281.3l-74.8 122.1a34.96 34.96 0 0 0-3 36.8c6 11.9 18.1 19.4 31.5 19.4h62.8a102.43 102.43 0 0 0-20.6 61.7c0 56.6 46 102.6 102.6 102.6s102.6-46 102.6-102.6c0-22.3-7.4-44-20.6-61.7h161.1a102.43 102.43 0 0 0-20.6 61.7c0 56.6 46 102.6 102.6 102.6s102.6-46 102.6-102.6c0-22.3-7.4-44-20.6-61.7H923c19.4 0 35.3-15.8 35.3-35.3a35.42 35.42 0 0 0-35.4-35.2M305.7 253l575.8 1.9l-56.4 315.8l-452.3.8zm96.9 612.7c-17.4 0-31.6-14.2-31.6-31.6s14.2-31.6 31.6-31.6s31.6 14.2 31.6 31.6a31.6 31.6 0 0 1-31.6 31.6m325.1 0c-17.4 0-31.6-14.2-31.6-31.6s14.2-31.6 31.6-31.6s31.6 14.2 31.6 31.6a31.6 31.6 0 0 1-31.6 31.6" />
                  </svg>
                </div>
                <div class="flex flex-col">
                    <span class="text-lg text-slate-300 font-bold leading-5">Store</span>
                    <span class="text-sm text-slate-500 hidden md:block">Tienda de Productos</span>
                </div>
            </a>
            <!-- Menu Items End -->
             <div class="divider my-2"></div>
             <button class="btn btn-ghost text-info hover:text-red-500 w-full" (click)="authService.logout()">Cerrar Sesión</button>
           </div>
        </div>

        <div class="flex-1 md:ml-64 pt-5 px-5">
          <router-outlet />
        </div>

        <div class="dropdown dropdown-end absolute top-4 right-1 block md:hidden">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="1.32em" height="1.5em" viewBox="0 0 448 512">
              <path d="M0 0h448v512H0z" fill="none" />
              <path fill="currentColor" d="M0 96c0-17.7 14.3-32 32-32h384c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32m0 160c0-17.7 14.3-32 32-32h384c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32m448 160c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h384c17.7 0 32 14.3 32 32" />
            </svg>
          </div>
          <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
            <li><a routerLink="/admin/dashboards" class="btn btn-ghost" routerLinkActive="text-secondary">Dashboard</a></li>
            <li><a routerLink="/admin/products" class="btn btn-ghost" routerLinkActive="text-secondary">Productos</a></li>
            <li><a routerLink="/" class="btn btn-ghost" routerLinkActive="text-secondary" [routerLinkActiveOptions]="{exact: true}">Store</a></li>
            <li><button class="btn btn-ghost text-info hover:text-red-500 w-full" (click)="authService.logout()">Cerrar Sesión</button></li>
          </ul>
        </div>
    </div>
</div>
