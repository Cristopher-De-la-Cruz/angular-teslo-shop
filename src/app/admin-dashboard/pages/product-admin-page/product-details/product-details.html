<h1 class="text-2xl font-bold truncate pr-5">{{ product().title }}</h1>
<div class="divider"></div>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <div class="w-full flex justify-between">
      <h2 class="text-2xl font-bold h-12 truncate">Datos generales</h2>
      <button class="btn btn-secondary block lg:hidden" type="submit">
        Guardar
      </button>
    </div>
    <app-label-input label="Título" [form]="productForm" [control]="productForm.controls.title" />
    <app-label-input label="Slug" [form]="productForm" [control]="productForm.controls.slug" />

    <div class="w-full lg:w-4/6">
      <app-label-textarea label="Descripción" [form]="productForm" [control]="productForm.controls.description" [rows]="6" />
    </div>

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div>
        <app-label-input inputType="number" label="Precio" [form]="productForm" [control]="productForm.controls.price" />
      </div>
      <div>
        <app-label-input inputType="number" label="Inventario" [form]="productForm" [control]="productForm.controls.stock" />
      </div>
    </div>

    <!-- tags -->
    <app-label-input label="Tags" [form]="productForm" [control]="productForm.controls.tags" />

    <!-- Botones para el género -->
    <div class="grid grid-cols-4 gap-2">
      @for (gender of genders; track gender) {
        <button type="button"
          class="btn btn-sm btn-primary" [class.btn-primary]="productForm.value.gender === gender.toLowerCase()"
          (click)="productForm.patchValue({gender: gender.toLowerCase()})"
          >{{ gender }}</button>
      }
    </div>

    <!-- Sizes -->
    <div class="grid grid-cols-6 gap-2">
      @for (size of sizes; track size) {
      <button type="button" class="btn btn-sm btn-outline" [class.btn-primary]="productForm.value.sizes?.includes(size)" (click)="onSizeClicked(size)">{{ size }}</button>
      }
    </div>
  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="hidden lg:flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->
        Guardar
      </button>
    </div>

    <product-carousel [images]="carrouselImages()" />

    <app-adjuntador (filesChanged)="onFilesChanged($event)" />

    <!-- <input
      type="file"
      multiple
      accept="image/*"
      class="file-input file-input-bordered w-full mt-4"
      (change)="onFilesChanged($event)"
      />

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
        @for (image of tempImages(); track image) {
          <img [src]="image" alt="Temporal image" class="w-full object-cover rounded-xl">
        }

      </div> -->
  </div>
</form>
@if (wasSaved()) {
  <app-alert message="Datos grabados correctamente" />
}
@if (hasErrors()) {
  <app-alert type="error" message="Error en el formulario" />
}
