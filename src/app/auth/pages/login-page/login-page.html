<form class="flex flex-col gap-2" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <app-label-input label="Email" [form]="loginForm" [control]="loginForm.controls.email">
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32">
      <path d="M0 0h32v32H0z" fill="none" />
      <path fill="gray"
        d="M28 6H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-2.2 2L16 14.78L6.2 8ZM4 24V8.91l11.43 7.91a1 1 0 0 0 1.14 0L28 8.91V24Z" />
    </svg>
  </app-label-input>
  <app-label-input label="Contraseña" inputType="password" [form]="loginForm" [control]="loginForm.controls.password">
    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
        <path
          d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
        </path>
        <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
      </g>
    </svg>
  </app-label-input>

  <button class="btn btn-secondary" type="submit">Login</button>
  <p>
    ¿No tienes cuenta?
    <a routerLink="/auth/register" class="text-secondary">Crea una aqui</a>
  </p>
</form>


@if (hasError()) {
  <app-alert type="error" message="Credenciales Incorrectas" />
}

@if (isSuccess()) {
  <app-alert type="success" message="Credenciales Correctas" />
}
