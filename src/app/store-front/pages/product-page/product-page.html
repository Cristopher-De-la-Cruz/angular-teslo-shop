@if (productResource.isLoading()) {
  <div class="flex justify-center items-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}
@if(productResource.hasValue()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 py-5">
    <!-- Imagenes -->
    <product-carousel [images]="productResource.value()?.images ?? []" />

    <div>
      <h1 class="text-3xl font-montserrat font-bold text-primary">{{ productResource.value()?.title }}</h1>
      <hr>
      <h2 class="text-lg text-info mt-2">{{ productResource.value()?.description }}</h2>

    </div>
  </div>
}
