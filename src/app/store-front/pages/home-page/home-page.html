<section class="mb-7">
  <h1 class="text-3xl font-bold font-montserrat">Todos los productos</h1>
  <h2 class="text-xl">Para todos los gustos</h2>
</section>

<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">

  @if (productsResource.isLoading()) {
    @for (item of [1,2,3,4,5,6,7,8,9]; track $index) {
      <product-card-skeleton />
    }
  } @else {
    @for (product of productsResource.value()?.products ?? []; track product.id) {
       <product-card
        [product]="product"
         />
     }
  }

</section>
